[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-email-support-backend"
version = "0.1.0"
description = "FastAPI backend for the RAG email support agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "langchain>=0.3",
  "langgraph>=0.2",
  "langsmith>=0.2",
  "pydantic-settings>=2.7",
  "supabase>=2.11",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

